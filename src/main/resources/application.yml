app:
  zone-id: ${APP_ZONE_ID:Asia/Jerusalem}
  activation:
    enabled: ${APP_ACTIVATION_ENABLED:true}
    fixed-delay: ${APP_ACTIVATION_FIXED_DELAY:PT5M}

spring:
  application:
    name: taskpilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskpilot}
    username: ${DB_USERNAME:taskpilot}
    password: ${DB_PASSWORD:taskpilot}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
